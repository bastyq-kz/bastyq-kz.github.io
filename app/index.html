<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бастық — демо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём из темы телеграма, но с запасными значениями: витрину должно
     быть можно открыть и обычной ссылкой в браузере, а не только из бота. */
  :root{
    --bg:#F6F8F7; --card:#FFFFFF; --ink:#14181A; --dim:#5C6771; --line:#E4EAE8;
    --accent:#146B54; --up:#1F8A5F; --down:#B4412F; --warn:#B4611F; --warn-bg:#FBF1E6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1413; --card:#171D1B; --ink:#EDF1EF; --dim:#93A099; --line:#232B29;
      --accent:#4FB894; --up:#5BC08F; --down:#E08A76; --warn:#E0A468; --warn-bg:#241C12;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1413; --card:#171D1B; --ink:#EDF1EF; --dim:#93A099; --line:#232B29;
    --accent:#4FB894; --up:#5BC08F; --down:#E08A76; --warn:#E0A468; --warn-bg:#241C12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;
       padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}

  .top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);
        display:flex;flex-direction:column;justify-content:center;gap:2.5px;padding:0 6px;flex:none}
  .mark i{display:block;height:3px;background:#fff;border-radius:99px}
  .mark i:nth-child(1){width:100%}.mark i:nth-child(2){width:72%}.mark i:nth-child(3){width:46%}
  .name{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .badge{margin-left:auto;font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;
         text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
         padding:4px 7px;border-radius:5px;opacity:.85}

  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
        border-radius:11px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--dim);font:600 14px/1 inherit;
               padding:9px 4px;border-radius:8px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 16px 14px;margin-bottom:11px}
  .cap{font:600 11px/1 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;
       color:var(--dim);margin:0 0 8px}
  .big{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:0}
  .delta{display:inline-block;margin-top:7px;font-size:13.5px;font-weight:600}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)}
  .delta span{color:var(--dim);font-weight:400}

  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:11px}
  .grid .card{margin:0;padding:13px 12px}
  .grid .num{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .grid .cap{margin-bottom:5px;font-size:10px}

  h2{font:700 15px/1.25 inherit;margin:18px 0 9px;letter-spacing:-.01em}
  .find{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
        border-radius:0 12px 12px 0;padding:13px 14px;margin-bottom:9px}
  .find h3{margin:0 0 5px;font-size:15px;font-weight:700}
  .find p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
  .find .do{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
            font-size:13.5px;color:var(--ink)}
  .find .do b{color:var(--accent)}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  td{padding:9px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}

  .cta{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;
       background:var(--accent);color:#fff;font:700 16px/1 inherit;padding:16px;
       cursor:pointer;text-align:center;text-decoration:none}
  .foot{margin-top:12px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark"><i></i><i></i><i></i></div>
    <div class="name">Цветочная мастерская «Пример»</div>
    <div class="badge">демо</div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-p="день" aria-selected="true">Вчера</button>
    <button role="tab" data-p="неделя" aria-selected="false">Неделя</button>
    <button role="tab" data-p="месяц" aria-selected="false">Месяц</button>
  </div>

  <div class="card">
    <p class="cap" id="подпись">Вчера</p>
    <p class="big" id="выручка">—</p>
    <span class="delta" id="дельта"></span>
  </div>

  <div class="grid">
    <div class="card"><p class="cap">Заказов</p><div class="num" id="заказов">—</div></div>
    <div class="card"><p class="cap">Чек</p><div class="num" id="чек">—</div></div>
    <div class="card"><p class="cap">В день</p><div class="num" id="вдень">—</div></div>
  </div>

  <h2>Что заметил Бастық</h2>
  <div id="находки"></div>

  <h2>Что продаётся</h2>
  <div class="card" style="padding:6px 16px"><table id="топ"></table></div>

  <a class="cta" id="кнопка" href="https://t.me/bastyq_bot?start=app">Хочу так же для своего бизнеса</a>
  <p class="foot">Цифры выдуманы: это демо-бизнес, которого не существует.<br>
  У вас будут ваши, из вашей кассы.</p>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  // Скрипт телеграма грузится и в обычном браузере, и там colorScheme всегда
  // «light». Поймано живьём 25.08.2026: страница, открытая ссылкой в тёмной
  // системе, прибивалась к светлой теме. Настоящий телеграм отличаем по platform.
  var вТелеграме = !!(tg && tg.platform && tg.platform !== "unknown");
  if (tg) {
    tg.ready(); tg.expand();
    if (вТелеграме) {
      document.documentElement.setAttribute("data-theme", tg.colorScheme || "light");
      try { tg.setBackgroundColor(tg.colorScheme === "dark" ? "#0F1413" : "#F6F8F7"); } catch (e) {}
    }
  }

  // Генератор ровно тот же, что в demo.py: недельный ритм, медленный рост,
  // провал в середине месяца. Иначе витрина и бот назовут разные числа,
  // и человек это заметит быстрее, чем мы.
  var ПО_ДНЯМ = [310000, 295000, 320000, 355000, 520000, 610000, 240000]; // пн…вс
  var НАЧАЛО = Date.UTC(2026, 0, 1);
  function день(d) {
    var wd = (d.getDay() + 6) % 7;                       // 0 = понедельник
    var base = ПО_ДНЯМ[wd];
    var прошло = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - НАЧАЛО) / 86400000);
    base = Math.round(base * (1 + 0.0009 * прошло));
    if (d.getDate() >= 12 && d.getDate() <= 19) base = Math.round(base * 0.78);
    return { выручка: base, заказов: Math.max(1, Math.round(base / 14800)) };
  }
  function сумма(откуда, сколько) {
    var в = 0, з = 0;
    for (var i = 0; i < сколько; i++) {
      var d = new Date(откуда); d.setDate(d.getDate() - i);
      var x = день(d); в += x.выручка; з += x.заказов;
    }
    return { выручка: в, заказов: з, дней: сколько };
  }
  function деньги(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸"; }

  var вчера = new Date(); вчера.setDate(вчера.getDate() - 1);
  var ПЕРИОДЫ = {
    "день":   { дней: 1,  подпись: "Вчера",            назад: "с позавчера" },
    "неделя": { дней: 7,  подпись: "Последние 7 дней", назад: "к прошлой неделе" },
    "месяц":  { дней: 30, подпись: "Последние 30 дней", назад: "к прошлому месяцу" }
  };

  var НАХОДКИ = [
    { когда: ["день", "неделя", "месяц"],
      з: "Поставщик поднял цену на розу на 20%",
      т: "Роза Эквадор 60 см: было 420 ₸, стало 505 ₸. Накладную с прошлой поставкой никто не сверял.",
      д: "Сверить с поставщиком и пересчитать цену букета." },
    { когда: ["неделя", "месяц"],
      з: "У одного флориста карточка клиента только у 18% заказов",
      т: "У остальных 89 и 95 процентов. За месяц мимо базы прошло 56 покупателей: их не позвать ни на акцию, ни при проблеме с заказом.",
      д: "Разобрать с ним лично, а не ругать всю смену." },
    { когда: ["месяц"],
      з: "Середина месяца просела на пятую часть",
      т: "С 12 по 19 число выручка ниже обычного. Это повторяется каждый месяц и обычно замечается только по итогу.",
      д: "Ставить акции и рассылки на этот отрезок, а не на конец месяца." }
  ];

  var ТОП = [
    ["Букет «Классика», 25 роз", 84, 1512000],
    ["Композиция в шляпной коробке", 61, 1098000],
    ["Букет «Нежность», пионовидные", 47, 987000],
    ["Моно-букет тюльпаны, 51", 39, 663000],
    ["Букет «Комплимент»", 33, 396000]
  ];

  function нарисовать(ключ) {
    var п = ПЕРИОДЫ[ключ];
    var сейчас = сумма(вчера, п.дней);
    var было = new Date(вчера); было.setDate(было.getDate() - п.дней);
    var раньше = сумма(было, п.дней);
    var изм = раньше.выручка ? Math.round((сейчас.выручка - раньше.выручка) / раньше.выручка * 100) : 0;

    document.getElementById("подпись").textContent = п.подпись;
    document.getElementById("выручка").textContent = деньги(сейчас.выручка);
    var d = document.getElementById("дельта");
    d.className = "delta " + (изм >= 0 ? "up" : "down");
    d.innerHTML = (изм >= 0 ? "+" : "") + изм + "% <span>" + п.назад + "</span>";
    document.getElementById("заказов").textContent = сейчас.заказов;
    document.getElementById("чек").textContent = деньги(сейчас.выручка / сейчас.заказов);
    document.getElementById("вдень").textContent = деньги(сейчас.выручка / п.дней);

    document.getElementById("находки").innerHTML = НАХОДКИ
      .filter(function (f) { return f.когда.indexOf(ключ) > -1; })
      .map(function (f) {
        return '<div class="find"><h3>' + f.з + "</h3><p>" + f.т +
               '</p><p class="do"><b>Что делать:</b> ' + f.д + "</p></div>";
      }).join("") || '<div class="card"><p class="cap">Тихо</p><p style="margin:0;color:var(--dim)">' +
                     "За этот день ничего тревожного не нашлось. Это тоже ответ.</p></div>";

    document.getElementById("топ").innerHTML = ТОП.map(function (r) {
      return "<tr><td>" + r[0] + "</td><td>" + r[1] + " шт · " + деньги(r[2]) + "</td></tr>";
    }).join("");
  }

  var кнопки = [].slice.call(document.querySelectorAll(".tabs button"));
  кнопки.forEach(function (b) {
    b.addEventListener("click", function () {
      кнопки.forEach(function (x) { x.setAttribute("aria-selected", String(x === b)); });
      нарисовать(b.dataset.p);
      if (вТелеграме && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
    });
  });
  нарисовать("день");

  // Из мини-аппа ссылка на бота открывается неправильно: получается окно внутри
  // окна. Поэтому просим телеграм открыть чат сам и закрываемся.
  document.getElementById("кнопка").addEventListener("click", function (e) {
    if (вТелеграме && tg.openTelegramLink) {
      e.preventDefault();
      tg.openTelegramLink("https://t.me/bastyq_bot?start=app");
      tg.close();
    }
  });
})();
</script>
</body>
</html>
